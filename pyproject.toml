[project]
name = "agy-token-optimizer"
version = "2.0.0"
description = "Deterministic local token optimizer, cascade model router, and architecture suite for Google Antigravity & OpenCode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "datamaq-automation" }
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
